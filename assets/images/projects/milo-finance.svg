<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Milo Finance Tracker</title><desc id="desc">A dark finance dashboard with budget cards, a balance chart, and transaction rows.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08120f"/><stop offset="1" stop-color="#14231d"/></linearGradient><linearGradient id="g" x2="1"><stop stop-color="#53e076"/><stop offset="1" stop-color="#d3ff6c"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="12"/></filter></defs>
  <rect width="1200" height="675" fill="url(#bg)"/><circle cx="1050" cy="110" r="190" fill="#53e076" opacity=".08" filter="url(#glow)"/><rect x="64" y="56" width="1072" height="563" rx="30" fill="#101814" stroke="#53e076" stroke-opacity=".2"/><text x="108" y="118" fill="#53e076" font-family="Arial" font-size="21" font-weight="700" letter-spacing="3">MILO</text><text x="108" y="165" fill="#f4fff6" font-family="Arial" font-size="42" font-weight="800">Your money, made clear.</text><text x="108" y="202" fill="#9aaba0" font-family="Arial" font-size="18">Budgets, spending and goals in one calm workspace.</text>
  <rect x="108" y="246" width="280" height="144" rx="20" fill="#17251e" stroke="#53e076" stroke-opacity=".25"/><text x="136" y="282" fill="#8ea097" font-family="Arial" font-size="15">AVAILABLE BALANCE</text><text x="136" y="337" fill="#f6fff8" font-family="Arial" font-size="40" font-weight="800">£2,480.65</text><text x="136" y="369" fill="#53e076" font-family="Arial" font-size="15">↑ 12.4% this month</text>
  <rect x="412" y="246" width="680" height="285" rx="20" fill="#151d19" stroke="#ffffff" stroke-opacity=".08"/><text x="446" y="286" fill="#f6fff8" font-family="Arial" font-size="19" font-weight="700">Spending overview</text><g stroke="#ffffff" stroke-opacity=".08"><path d="M446 330h610M446 382h610M446 434h610M446 486h610"/></g><path d="M446 474C510 458 533 394 602 416s104 18 151-45 96-65 146-31 94-5 157-72" fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round"/><path d="M446 474C510 458 533 394 602 416s104 18 151-45 96-65 146-31 94-5 157-72v218H446z" fill="#53e076" opacity=".08"/>
  <rect x="108" y="414" width="280" height="117" rx="20" fill="#171d1a" stroke="#ffffff" stroke-opacity=".08"/><text x="136" y="452" fill="#8ea097" font-family="Arial" font-size="15">SAVINGS GOAL</text><text x="136" y="489" fill="#f6fff8" font-family="Arial" font-size="24" font-weight="700">New laptop</text><rect x="136" y="506" width="220" height="8" rx="4" fill="#29362f"/><rect x="136" y="506" width="151" height="8" rx="4" fill="url(#g)"/><text x="108" y="580" fill="#8ea097" font-family="Arial" font-size="16">TRACK • PLAN • GROW</text>
</svg>
