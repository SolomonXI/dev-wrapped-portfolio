  <g font-family="Arial"><rect x="86" y="276" width="555" height="100" rx="22" fill="#1d1427" stroke="#b98cff" stroke-opacity=".2"/><text x="120" y="314" fill="#a896af" font-size="15">CURRENT STREAK</text><text x="120" y="354" fill="#fff" font-size="34" font-weight="800">18 focused days</text><rect x="86" y="397" width="260" height="126" rx="22" fill="#1d1427" stroke="#ffffff" stroke-opacity=".08"/><text x="116" y="436" fill="#a896af" font-size="15">HABITS TODAY</text><text x="116" y="487" fill="#fff" font-size="36" font-weight="800">8 / 11</text><rect x="366" y="397" width="275" height="126" rx="22" fill="#1d1427" stroke="#ffffff" stroke-opacity=".08"/><text x="396" y="436" fill="#a896af" font-size="15">WEEKLY CONSISTENCY</text><text x="396" y="487" fill="url(#g)" font-size="36" font-weight="800">86%</text></g>
