<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Shadow Routine</title><desc id="desc">A purple mobile routine dashboard with daily tasks, a progress ring, and habit cards.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#100b19"/><stop offset="1" stop-color="#241135"/></linearGradient><linearGradient id="g" x2="1" y2="1"><stop stop-color="#b98cff"/><stop offset="1" stop-color="#ff8ecd"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="18"/></filter></defs>
  <rect width="1200" height="675" fill="url(#bg)"/><circle cx="260" cy="80" r="210" fill="#ad73ff" opacity=".12" filter="url(#glow)"/><circle cx="1000" cy="590" r="240" fill="#ff72c6" opacity=".09" filter="url(#glow)"/><text x="86" y="95" fill="#bd91ff" font-family="Arial" font-size="18" font-weight="700" letter-spacing="4">SHADOW ROUTINE</text><text x="86" y="161" fill="#fff7ff" font-family="Arial" font-size="50" font-weight="800">Build days that build you.</text><text x="86" y="202" fill="#baaebe" font-family="Arial" font-size="19">Plan routines, track habits, and keep your momentum visible.</text>
